<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9AA0A6"/>
    </marker>
  </defs>
  <rect width="820" height="760" fill="#FBFAF8"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#23201D">Quiet Spaces Manhattan — editorial pipeline</text>
  <text x="40" y="61" font-size="12.5" fill="#8A8A8A">how the unit (URLs → articles → mentions → pairs → venues) and the count change through each stage</text>

  <!-- arrows spine -->
  <g stroke="#C7CBD1" stroke-width="2" marker-end="url(#arr)">
    <line x1="210" y1="128" x2="210" y2="150"/>
    <line x1="210" y1="200" x2="210" y2="222"/>
    <line x1="210" y1="272" x2="210" y2="294"/>
    <line x1="210" y1="344" x2="210" y2="366"/>
    <line x1="210" y1="416" x2="210" y2="438"/>
    <line x1="210" y1="488" x2="210" y2="510"/>
    <line x1="210" y1="560" x2="210" y2="582"/>
    <line x1="210" y1="632" x2="210" y2="654"/>
  </g>

  <!-- boxes: x=60 w=300 h=56 -->
  <!-- 1 discovery -->
  <g><rect x="60" y="72" width="300" height="56" rx="10" fill="#DCE7F2" stroke="#BBD0E6"/>
     <text x="74" y="92" font-size="11" fill="#4E6F94">1 · Discovery (Brave + goggle)</text>
     <text x="74" y="116" font-size="18" font-weight="800" fill="#23201D">481 <tspan font-size="12" font-weight="400" fill="#6B6B6B">candidate URLs</tspan></text></g>
  <!-- 2 corpus -->
  <g><rect x="60" y="144" width="300" height="56" rx="10" fill="#DCE7F2" stroke="#BBD0E6"/>
     <text x="74" y="164" font-size="11" fill="#4E6F94">2 · Corpus (robots-aware fetch + extract)</text>
     <text x="74" y="188" font-size="18" font-weight="800" fill="#23201D">363 <tspan font-size="12" font-weight="400" fill="#6B6B6B">articles fetched</tspan></text></g>
  <!-- 3 relevance -->
  <g><rect x="60" y="216" width="300" height="56" rx="10" fill="#DCE7F2" stroke="#BBD0E6"/>
     <text x="74" y="236" font-size="11" fill="#4E6F94">3 · Relevance — Stage 1 (Haiku filter)</text>
     <text x="74" y="260" font-size="18" font-weight="800" fill="#23201D">106 <tspan font-size="12" font-weight="400" fill="#6B6B6B">relevant articles</tspan></text></g>
  <!-- 4 extraction -->
  <g><rect x="60" y="288" width="300" height="56" rx="10" fill="#F1E7D6" stroke="#E2CFA9"/>
     <text x="74" y="308" font-size="11" fill="#9A7B3F">4 · Extraction — Stage 2 (Haiku per-venue)</text>
     <text x="74" y="332" font-size="18" font-weight="800" fill="#23201D">1,387 <tspan font-size="12" font-weight="400" fill="#6B6B6B">venue mentions</tspan></text></g>
  <!-- 5 clean -->
  <g><rect x="60" y="360" width="300" height="56" rx="10" fill="#F1E7D6" stroke="#E2CFA9"/>
     <text x="74" y="380" font-size="11" fill="#9A7B3F">5 · Clean + attribute audit + endorsement re-score</text>
     <text x="74" y="404" font-size="18" font-weight="800" fill="#23201D">1,387 <tspan font-size="12" font-weight="400" fill="#6B6B6B">mentions (corrected)</tspan></text></g>
  <!-- 6 scope -->
  <g><rect x="60" y="432" width="300" height="56" rx="10" fill="#DCEDE3" stroke="#B6D9C4"/>
     <text x="74" y="452" font-size="11" fill="#3E7A57">6a · Scope filter → distinct pairs</text>
     <text x="74" y="476" font-size="18" font-weight="800" fill="#23201D">1,100 <tspan font-size="12" font-weight="400" fill="#6B6B6B">in-scope → 1,018 pairs</tspan></text></g>
  <!-- 7 resolution -->
  <g><rect x="60" y="504" width="300" height="56" rx="10" fill="#DCEDE3" stroke="#B6D9C4"/>
     <text x="74" y="524" font-size="11" fill="#3E7A57">6b · Resolution — Google place_id</text>
     <text x="74" y="548" font-size="18" font-weight="800" fill="#23201D">1,018 <tspan font-size="12" font-weight="400" fill="#6B6B6B">pairs resolved</tspan></text></g>
  <!-- 8 aggregation -->
  <g><rect x="60" y="576" width="300" height="56" rx="10" fill="#DCEDE3" stroke="#B6D9C4"/>
     <text x="74" y="596" font-size="11" fill="#3E7A57">6c · Aggregation → one row per venue</text>
     <text x="74" y="620" font-size="18" font-weight="800" fill="#23201D">326 <tspan font-size="12" font-weight="400" fill="#6B6B6B">canonical venues</tspan></text></g>
  <!-- 9 enrichment -->
  <g><rect x="60" y="648" width="300" height="56" rx="10" fill="#E7DEF1" stroke="#CDBCE4"/>
     <text x="74" y="668" font-size="11" fill="#7A5B9A">7 · OSM enrichment (factual layer)</text>
     <text x="74" y="692" font-size="18" font-weight="800" fill="#23201D">326 <tspan font-size="12" font-weight="400" fill="#6B6B6B">venues + OSM (239 matched)</tspan></text></g>

  <!-- delta annotations (right) -->
  <g font-size="11.5">
    <text x="392" y="142" fill="#C0392B">− 118 unreachable / duplicate / non-article</text>
    <text x="392" y="214" fill="#C0392B">− 266 off-topic  <tspan fill="#1E8449">+ 9 library-recovery</tspan></text>
    <text x="392" y="286" fill="#1E8449">+ fields: endorsement, 10 attributes, quote, framing…</text>
    <text x="392" y="358" fill="#5C574F">87 identity fixes · 415 attr-cells fixed · 62 re-scored</text>
    <text x="392" y="430" fill="#C0392B">− 287 out of scope (work / category / access /</text>
    <text x="392" y="446" fill="#C0392B">  chain-generic / non-featured); 1,100 → 1,018 distinct</text>
    <text x="392" y="538" fill="#5C574F">requery → manual review → recover → merge sub-venues</text>
    <text x="392" y="608" fill="#C0392B">− 57 closed · − 187 non-Manhattan · − merges/drops</text>
    <text x="392" y="680" fill="#1E8449">+ OSM tags · accessibility 9 → 82 venues</text>
  </g>

  <!-- legend -->
  <g transform="translate(392,712)" font-size="11" fill="#6B6B6B">
    <rect x="0" y="-9" width="12" height="12" rx="2" fill="#DCE7F2"/><text x="18" y="1">acquisition</text>
    <rect x="110" y="-9" width="12" height="12" rx="2" fill="#F1E7D6"/><text x="128" y="1">extraction</text>
    <rect x="214" y="-9" width="12" height="12" rx="2" fill="#DCEDE3"/><text x="232" y="1">canonicalization</text>
    <rect x="350" y="-9" width="12" height="12" rx="2" fill="#E7DEF1"/><text x="368" y="1">enrichment</text>
  </g>
</svg>
